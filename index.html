<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plano Interactivo de 6 Locales</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at center, #ffffff 40%, #f7f9fc 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      color: #333;
      overflow-x: hidden;
    }

    h1 {
      margin-top: 30px;
      margin-bottom: 5px;
      font-weight: 600;
      color: #1a202c;
      font-size: 2.2rem;
    }

    p.subtitle {
      color: #718096;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 1.05rem;
    }

    .map-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      padding: 15px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    /* Áreas interactivas transparentes sobre los locales */
    .local-overlay {
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.25s ease, fill-opacity 0.25s ease, stroke 0.25s ease;
      fill: #3b82f6;
      fill-opacity: 0.15;
      stroke: #3b82f6;
      stroke-width: 2px;
      rx: 8px;
    }

    /* Efecto de elevación y resalte de color */
    .local-overlay:hover, .local-overlay.active {
      transform: scale(1.05);
      fill-opacity: 0.35;
      stroke: #1d4ed8;
      stroke-width: 4px;
      filter: drop-shadow(0px 8px 16px rgba(0, 0, 0, 0.2));
    }

    /* Texto o indicador flotante */
    .local-tag {
      pointer-events: none;
      font-size: 14px;
      fill: #1e293b;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* Tarjeta flotante de información */
    .info-card {
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid #e2e8f0;
      padding: 16px 28px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      width: 100%;
      max-width: 450px;
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 0.6;
      transform: translateY(10px);
    }

    .info-card.active {
      opacity: 1;
      transform: translateY(0);
      border-color: #3b82f6;
      box-shadow: 0 12px 30px rgba(59, 130, 246, 0.15);
    }

    .info-card h3 {
      margin: 0 0 6px 0;
      font-size: 1.2rem;
      color: #1a202c;
    }

    .info-card p {
      margin: 0;
      font-size: 0.95rem;
      color: #4a5568;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <h1>Plano Interactivo</h1>
  <p class="subtitle">Pasa el cursor sobre cualquiera de los 6 locales</p>

  <div class="map-container">
    <svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
      
      <!-- Imagen de fondo (Reemplaza 'mapa.jpg' por el nombre de tu archivo en GitHub) -->
      <image href="Practicaproyeto.jpg" x="0" y="0" width="900" height="500" preserveAspectRatio="none"/>

      <!-- FILA SUPERIOR -->
      <!-- Local 1 (Arriba Izquierda) -->
      <g>
        <rect class="local-overlay" x="80" y="40" width="210" height="190"
              data-title="Local 1: Modulo Norte A" 
              data-desc="Área comercial de exhibición principal con acceso a terraza." />
        <text class="local-tag" x="185" y="245">Local 1</text>
      </g>

      <!-- Local 2 (Arriba Centro) -->
      <g>
        <rect class="local-overlay" x="335" y="40" width="230" height="190"
              data-title="Local 2: Modulo Norte B" 
              data-desc="Espacio amplio de recepción, ideal para showroom o salas de junta." />
        <text class="local-tag" x="450" y="245">Local 2</text>
      </g>

      <!-- Local 3 (Arriba Derecha) -->
      <g>
        <rect class="local-overlay" x="605" y="40" width="210" height="190"
              data-title="Local 3: Modulo Norte C" 
              data-desc="Área de oficinas privadas con área de servicios integrada." />
        <text class="local-tag" x="710" y="245">Local 3</text>
      </g>

      <!-- FILA INFERIOR -->
      <!-- Local 4 (Abajo Izquierda) -->
      <g>
        <rect class="local-overlay" x="80" y="270" width="210" height="190"
              data-title="Local 4: Modulo Sur A" 
              data-desc="Zona gastronómica o cafetería con acceso a pasillo lateral." />
        <text class="local-tag" x="185" y="475">Local 4</text>
      </g>

      <!-- Local 5 (Abajo Centro) -->
      <g>
        <rect class="local-overlay" x="335" y="270" width="230" height="190"
              data-title="Local 5: Modulo Sur B" 
              data-desc="Local central de doble altura con habitaciones de servicio." />
        <text class="local-tag" x="450" y="475">Local 5</text>
      </g>

      <!-- Local 6 (Abajo Derecha) -->
      <g>
        <rect class="local-overlay" x="605" y="270" width="210" height="190"
              data-title="Local 6: Modulo Sur C" 
              data-desc="Oficina ejecutiva con suite privada y balcón exterior." />
        <text class="local-tag" x="710" y="475">Local 6</text>
      </g>

    </svg>

    <!-- Tarjeta flotante de información -->
    <div id="infoCard" class="info-card">
      <h3 id="cardTitle">Selecciona un local</h3>
      <p id="cardDesc">Pasa el cursor sobre cualquiera de los 6 bloques arriba para ver su información.</p>
    </div>
  </div>

  <script>
    const overlays = document.querySelectorAll('.local-overlay');
    const infoCard = document.getElementById('infoCard');
    const cardTitle = document.getElementById('cardTitle');
    const cardDesc = document.getElementById('cardDesc');

    function activateLocal(overlay) {
      overlays.forEach(o => o.classList.remove('active'));
      overlay.classList.add('active');
      cardTitle.textContent = overlay.getAttribute('data-title');
      cardDesc.textContent = overlay.getAttribute('data-desc');
      infoCard.classList.add('active');
    }

    overlays.forEach(overlay => {
      overlay.addEventListener('mouseenter', () => activateLocal(overlay));
      overlay.addEventListener('click', (e) => {
        e.stopPropagation();
        activateLocal(overlay);
      });
    });
  </script>

</body>
</html>
