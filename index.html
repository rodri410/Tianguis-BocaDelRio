<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plano Interactivo - Prueba 2</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at center, #ffffff 40%, #f7f9fc 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      color: #333;
      overflow-x: hidden;
    }

    h1 {
      margin-top: 40px;
      margin-bottom: 5px;
      font-weight: 600;
      color: #1a202c;
      font-size: 2.2rem;
    }

    p.subtitle {
      color: #718096;
      margin-top: 0;
      margin-bottom: 35px;
      font-size: 1.1rem;
    }

    .map-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      padding: 20px;
      box-sizing: border-box;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      background: #ffffff;
    }

    /* Base del local */
    .pin {
      stroke-width: 3px;
      stroke: #ffffff;
      rx: 10px;
      transition: stroke 0.25s ease, stroke-width 0.25s ease;
    }

    /* Animación de levitación e interactividad táctil */
    .pin-group {
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
      pointer-events: all;
    }

    .pin-group * {
      pointer-events: none;
    }

    /* Estado Hover y Activo: Aumento claro, levitación y resalte de borde */
    .pin-group:hover, .pin-group.active {
      transform: scale(1.18) translateY(-6px);
      filter: drop-shadow(0px 12px 20px rgba(0, 0, 0, 0.2)) brightness(1.08);
    }

    .pin-group:hover .pin, .pin-group.active .pin {
      stroke: #1e293b;
      stroke-width: 4px;
    }

    /* Tarjeta flotante con entrada elástica */
    .info-card {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%) translateY(20px) scale(0.95);
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      border: 1px solid #e2e8f0;
      padding: 16px 28px;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      min-width: 260px;
      max-width: 380px;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      opacity: 0;
    }

    .info-card.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    .info-card h3 {
      margin: 0 0 6px 0;
      font-size: 1.15rem;
      color: #1a202c;
    }

    .info-card p {
      margin: 0;
      font-size: 0.92rem;
      color: #4a5568;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <h1>Plano de Locales</h1>
  <p class="subtitle">Pasa el cursor sobre un local para ver sus detalles</p>

  <div class="map-container">
    <svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
      <rect x="50" y="50" width="600" height="300" rx="15" fill="none" stroke="#f1f5f9" stroke-width="2"/>

      <!-- LOCAL 1 -->
      <g class="pin-group" data-title="Local 1: Tienda Central" data-desc="Especialistas en ropa urbana moderna. ¡Visítanos!">
        <rect class="pin" x="120" y="100" width="110" height="80" fill="#3b82f6" />
        <text x="175" y="145" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Local 1</text>
      </g>

      <!-- LOCAL 2 -->
      <g class="pin-group" data-title="Local 2: Zona de Accesorios" data-desc="La mayor variedad de gorras y accesorios de la ciudad.">
        <rect class="pin" x="250" y="100" width="110" height="80" fill="#10b981" />
        <text x="305" y="145" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Local 2</text>
      </g>

      <!-- LOCAL 3 -->
      <g class="pin-group" data-title="Local 3: Punto de Eventos" data-desc="Zona de activaciones, DJ sets y lanzamientos especiales.">
        <rect class="pin" x="380" y="100" width="110" height="80" fill="#8b5cf6" />
        <text x="435" y="145" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Local 3</text>
      </g>

      <!-- LOCAL 4 -->
      <g class="pin-group" data-title="Local 4: Showroom y Outlet" data-desc="Prueba las últimas colecciones y encuentra grandes ofertas.">
        <rect class="pin" x="510" y="100" width="110" height="80" fill="#f97316" />
        <text x="565" y="145" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Local 4</text>
      </g>
    </svg>

    <div id="infoCard" class="info-card">
      <h3 id="cardTitle">Selecciona un local</h3>
      <p id="cardDesc">Pasa el cursor sobre un punto para ver más detalles.</p>
    </div>
  </div>

  <script>
    const pinGroups = document.querySelectorAll('.pin-group');
    const infoCard = document.getElementById('infoCard');
    const cardTitle = document.getElementById('cardTitle');
    const cardDesc = document.getElementById('cardDesc');

    pinGroups.forEach(group => {
      const showInfo = () => {
        cardTitle.textContent = group.getAttribute('data-title');
        cardDesc.textContent = group.getAttribute('data-desc');
        infoCard.classList.add('visible');
        
        document.querySelectorAll('.pin-group').forEach(p => p.classList.remove('active'));
        group.classList.add('active');
      };

      const hideInfo = () => {
        if (matchMedia('(pointer:fine)').matches) {
           infoCard.classList.remove('visible');
           group.classList.remove('active');
        }
      };

      group.addEventListener('mouseenter', showInfo);
      group.addEventListener('mouseleave', hideInfo);
      group.addEventListener('click', (e) => {
          e.stopPropagation();
          showInfo();
      });
    });

    document.addEventListener('click', () => {
        infoCard.classList.remove('visible');
        document.querySelectorAll('.pin-group').forEach(p => p.classList.remove('active'));
    });
  </script>

</body>
</html>
