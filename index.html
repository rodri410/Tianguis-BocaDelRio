<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Locales - Prueba</title>
  <style>
    /* Estilos generales y fondo blanco luminoso */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at center, #ffffff 30%, #f0f4f8 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #333;
    }

    h1 {
      margin-bottom: 5px;
      font-weight: 600;
      color: #1a202c;
    }

    p.subtitle {
      color: #718096;
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    /* Contenedor principal de la mapa */
    .map-container {
      position: relative;
      width: 90%;
      max-width: 800px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05), 0 0 15px rgba(255, 255, 255, 0.8);
      border: 1px solid #e2e8f0;
      padding: 20px;
      box-sizing: border-box;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Estilo de los marcadores / locales */
    .pin {
      cursor: pointer;
      transition: transform 0.25s ease, fill 0.25s ease;
    }

    .pin:hover, .pin.active {
      transform: scale(1.25);
      transform-origin: center;
    }

    /* Tarjeta flotante de información */
    .info-card {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid #e2e8f0;
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
      min-width: 220px;
      pointer-events: none;
      transition: opacity 0.2s ease;
      opacity: 0;
    }

    .info-card.visible {
      opacity: 1;
    }

    .info-card h3 {
      margin: 0 0 4px 0;
      font-size: 1rem;
      color: #2d3748;
    }

    .info-card p {
      margin: 0;
      font-size: 0.85rem;
      color: #4a5568;
    }
  </style>
</head>
<body>

  <h1>Nuestros Locales</h1>
  <p class="subtitle">Haz clic o pasa el cursor sobre cada punto para ver información</p>

  <div class="map-container">
    <svg viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg">
      <!-- Fondo ilustrativo del plano / mapa básico -->
      <rect x="10" y="10" width="580" height="330" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />
      
      <!-- Rutas o caminos de referencia -->
      <path d="M 50 175 Q 300 120 550 175" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>

      <!-- LOCAL 1 -->
      <g class="pin-group" data-title="Local 1: Centro" data-desc="Especialistas en ropa urbana y accesorios.">
        <circle class="pin" cx="120" cy="160" r="14" fill="#3b82f6" stroke="#ffffff" stroke-width="3" />
        <text x="120" y="164" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold" pointer-events="none">1</text>
      </g>

      <!-- LOCAL 2 -->
      <g class="pin-group" data-title="Local 2: Norte" data-desc="Punto de venta y zona de eventos especiales.">
        <circle class="pin" cx="300" cy="140" r="14" fill="#10b981" stroke="#ffffff" stroke-width="3" />
        <text x="300" y="144" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold" pointer-events="none">2</text>
      </g>

      <!-- LOCAL 3 -->
      <g class="pin-group" data-title="Local 3: Sur" data-desc="Showroom interactivo y taller creativo.">
        <circle class="pin" cx="480" cy="180" r="14" fill="#8b5cf6" stroke="#ffffff" stroke-width="3" />
        <text x="480" y="184" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold" pointer-events="none">3</text>
      </g>
    </svg>

    <!-- Tarjeta flotante donde aparecerá la información -->
    <div id="infoCard" class="info-card">
      <h3 id="cardTitle">Selecciona un local</h3>
      <p id="cardDesc">Pasa el cursor sobre un punto para ver más detalles.</p>
    </div>
  </div>

  <script>
    const pinGroups = document.querySelectorAll('.pin-group');
    const infoCard = document.getElementById('infoCard');
    const cardTitle = document.getElementById('cardTitle');
    const cardDesc = document.getElementById('cardDesc');

    pinGroups.forEach(group => {
      const pin = group.querySelector('.pin');
      
      const showInfo = () => {
        cardTitle.textContent = group.getAttribute('data-title');
        cardDesc.textContent = group.getAttribute('data-desc');
        infoCard.classList.add('visible');
        
        // Quitar clase activa de los demás
        document.querySelectorAll('.pin').forEach(p => p.classList.remove('active'));
        pin.classList.add('active');
      };

      // Eventos para computadora (mouse) y celulares (touch)
      group.addEventListener('mouseenter', showInfo);
      group.addEventListener('click', showInfo);
    });
  </script>

</body>
</html>
