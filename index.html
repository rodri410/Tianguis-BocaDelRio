<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tianguis Digital — Mapa interactivo (prueba)</title>
<style>
  :root {
    --bg: #14121a;
    --panel: #1e1c26;
    --accent: #ff2654;
    --text: #f2f1f5;
    --muted: #a8a4b3;
    --overlay-hover: rgba(255,255,255,0.28);
    --overlay-active: rgba(255,255,255,0.42);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 20px clamp(16px, 4vw, 40px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  header h1 { margin: 0 0 4px; font-size: clamp(20px, 3vw, 28px); }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .map-wrap {
    position: relative;
    max-width: 900px;
    margin: 24px auto;
    padding: 0 16px;
  }
  .map-frame {
    position: relative;
    width: 100%;
    line-height: 0;
    border-radius: 16px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .map-frame img {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }
  .map-frame svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .local-hitbox {
    fill: var(--overlay-hover);
    fill-opacity: 0;
    stroke: #ffffff;
    stroke-opacity: 0;
    stroke-width: 4;
    cursor: pointer;
    transition: fill-opacity 0.12s ease, stroke-opacity 0.12s ease;
  }
  .local-hitbox:hover,
  .local-hitbox:focus-visible,
  .local-hitbox.is-active {
    fill-opacity: 1;
    stroke-opacity: 0.9;
  }
  .local-hitbox:focus-visible {
    outline: none;
  }

  /* Tooltip */
  #tooltip {
    position: fixed;
    z-index: 40;
    pointer-events: none;
    background: var(--panel);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.1);
    opacity: 0;
    transform: translate(-50%, -130%);
    transition: opacity 0.1s ease;
    white-space: nowrap;
  }
  #tooltip.visible { opacity: 1; }

  /* Modal */
  #modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(6,5,9,0.72);
    backdrop-filter: blur(2px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  #modal-backdrop.open { display: flex; }
  #modal {
    background: var(--panel);
    border-radius: 16px;
    width: 100%;
    max-width: 420px;
    max-height: 86vh;
    overflow-y: auto;
    padding: 24px;
    position: relative;
    border: 1px solid rgba(255,255,255,0.08);
  }
  #modal-close {
    position: absolute;
    top: 14px; right: 14px;
    background: rgba(255,255,255,0.08);
    border: none;
    color: var(--text);
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
  }
  #modal-close:hover { background: rgba(255,255,255,0.18); }
  #modal-image {
    width: 100%;
    aspect-ratio: 16/10;
    border-radius: 10px;
    background: #2a2733 center/cover no-repeat;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
  }
  #modal-category {
    display: inline-block;
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }
  #modal-title { margin: 0 0 12px; font-size: 22px; }
  #modal-desc { color: var(--muted); font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
  #modal-whatsapp {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #25d366;
    color: #06210f;
    font-weight: 700;
    text-decoration: none;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 15px;
  }
  #modal-whatsapp:hover { filter: brightness(1.05); }

  body.modal-open { overflow: hidden; }

  @media (max-width: 480px) {
    #tooltip { display: none; } /* en touch no mostramos tooltip flotante, se va directo al modal */
  }
</style>
</head>

  function getShop(id) {
    return shopsData[id] || FALLBACK_SHOP;
  }

  // ---- Tooltip (solo dispositivos con mouse) ----
  function showTooltip(evt, id) {
    if (isTouchDevice) return;
    const shop = getShop(id);
    tooltip.textContent = shop.nombre;
    tooltip.classList.add("visible");
    moveTooltip(evt);
  }
  function moveTooltip(evt) {
    if (isTouchDevice) return;
    tooltip.style.left = evt.clientX + "px";
    tooltip.style.top = evt.clientY + "px";
  }
  function hideTooltip() {
    tooltip.classList.remove("visible");
  }

  // ---- Modal ----
  function openModal(id) {
    const shop = getShop(id);

    modalCategory.textContent = shop.categoria || "";
    modalTitle.textContent = shop.nombre || "Local";
    modalDesc.textContent = shop.descripcion || "";

    if (shop.imagen) {
      modalImage.style.backgroundImage = "url(" + shop.imagen + ")";
      modalImage.textContent = "";
      const test = new Image();
      test.onerror = function () {
        modalImage.style.backgroundImage = "none";
        modalImage.textContent = "Imagen no disponible";
      };
      test.src = shop.imagen;
    } else {
      modalImage.style.backgroundImage = "none";
      modalImage.textContent = "Sin imagen";
    }

    if (shop.whatsapp) {
      const msg = encodeURIComponent(shop.mensaje || ("Hola, me interesa el local " + shop.nombre));
      modalWhatsapp.href = "https://wa.me/" + shop.whatsapp + "?text=" + msg;
      modalWhatsapp.style.display = "flex";
    } else {
      modalWhatsapp.style.display = "none";
    }

    modalBackdrop.classList.add("open");
    document.body.classList.add("modal-open");
  }

  function closeModal() {
    modalBackdrop.classList.remove("open");
    document.body.classList.remove("modal-open");
  }

  modalClose.addEventListener("click", closeModal);
  modalBackdrop.addEventListener("click", function (e) {
    if (e.target === modalBackdrop) closeModal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && modalBackdrop.classList.contains("open")) {
      closeModal();
    }
  });

  // ---- Eventos delegados sobre el SVG (funciona para los 127 locales) ----
  const svg = document.getElementById("overlaySvg");

  svg.addEventListener("mouseover", function (e) {
    const target = e.target.closest(".local-hitbox");
    if (!target) return;
    showTooltip(e, target.dataset.id);
  });

  svg.addEventListener("mousemove", function (e) {
    const target = e.target.closest(".local-hitbox");
    if (!target) return;
    moveTooltip(e);
  });

  svg.addEventListener("mouseout", function (e) {
    const target = e.target.closest(".local-hitbox");
    if (!target) return;
    hideTooltip();
  });

  svg.addEventListener("click", function (e) {
    const target = e.target.closest(".local-hitbox");
    if (!target) return;
    openModal(target.dataset.id);
  });

  // soporte teclado (accesibilidad)
  svg.addEventListener("keydown", function (e) {
    const target = e.target.closest(".local-hitbox");
    if (!target) return;
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      openModal(target.dataset.id);
    }
  });

  // ---- Fallback si la imagen de fondo no carga ----
  mapImage.addEventListener("error", function () {
    const frame = document.getElementById("mapFrame");
    frame.innerHTML =
      '<div style="padding:60px 20px;text-align:center;color:#a8a4b3;">' +
      'No se pudo cargar la imagen del mapa (mapa-tianguis.png).<br>' +
      'Verifica que el archivo esté en la misma carpeta que este HTML.' +
      "</div>";
  });
})();
</script>
