<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plano Interactivo de Locales</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at center, #ffffff 40%, #f7f9fc 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      color: #333;
      overflow-x: hidden;
    }

    h1 {
      margin-top: 40px;
      margin-bottom: 5px;
      font-weight: 600;
      color: #1a202c;
      font-size: 2.2rem;
    }

    p.subtitle {
      color: #718096;
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 1.1rem;
    }

    .map-container {
      position: relative;
      width: 100%;
      max-width: 850px;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      background: #ffffff;
    }

    /* Estilo interactivo del cuadro */
    .local-box {
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.25s ease, filter 0.25s ease, stroke 0.25s ease;
      stroke-width: 3px;
      stroke: #ffffff;
      rx: 12px;
    }

    /* Efecto Hover directo */
    .local-box:hover, .local-box.active {
      transform: scale(1.15) translateY(-5px);
      filter: drop-shadow(0px 10px 18px rgba(0, 0, 0, 0.25));
      stroke: #1e293b;
      stroke-width: 4px;
    }

    /* Texto dentro del cuadro (no interfiere con el cursor) */
    .local-text {
      pointer-events: none;
      font-size: 16px;
      fill: #ffffff;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* Tarjeta de información inferior */
    .info-card {
      margin-top: 25px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid #e2e8f0;
      padding: 18px 30px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      width: 100%;
      max-width: 420px;
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 0.5;
      transform: translateY(10px);
    }

    .info-card.active {
      opacity: 1;
      transform: translateY(0);
      border-color: #3b82f6;
      box-shadow: 0 12px 30px rgba(59, 130, 246, 0.15);
    }

    .info-card h3 {
      margin: 0 0 6px 0;
      font-size: 1.2rem;
      color: #1a202c;
    }

    .info-card p {
      margin: 0;
      font-size: 0.95rem;
      color: #4a5568;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <h1>Plano de Locales</h1>
  <p class="subtitle">Pasa el cursor o presiona un local para ver sus detalles</p>

  <div class="map-container">
    <svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
      <rect x="30" y="30" width="640" height="240" rx="15" fill="none" stroke="#f1f5f9" stroke-width="2"/>

      <!-- LOCAL 1 -->
      <g>
        <rect class="local-box" x="70" y="90" width="120" height="100" fill="#0088cc" 
              data-title="Local 1: Tienda Central" 
              data-desc="Especialistas en ropa urbana moderna. ¡Visítanos!" />
        <text class="local-text" x="130" y="140">Local 1</text>
      </g>

      <!-- LOCAL 2 -->
      <g>
        <rect class="local-box" x="210" y="90" width="120" height="100" fill="#00a86b" 
              data-title="Local 2: Zona de Accesorios" 
              data-desc="La mayor variedad de gorras y accesorios de la ciudad." />
        <text class="local-text" x="270" y="140">Local 2</text>
      </g>

      <!-- LOCAL 3 -->
      <g>
        <rect class="local-box" x="350" y="90" width="120" height="100" fill="#6b5b95" 
              data-title="Local 3: Punto de Eventos" 
              data-desc="Zona de activaciones, DJ sets y lanzamientos especiales." />
        <text class="local-text" x="410" y="140">Local 3</text>
      </g>

      <!-- LOCAL 4 -->
      <g>
        <rect class="local-box" x="490" y="90" width="120" height="100" fill="#d96b27" 
              data-title="Local 4: Showroom y Outlet" 
              data-desc="Prueba las últimas colecciones y encuentra grandes ofertas." />
        <text class="local-text" x="550" y="140">Local 4</text>
      </g>
    </svg>

    <!-- Tarjeta flotante de información -->
    <div id="infoCard" class="info-card">
      <h3 id="cardTitle">Selecciona un local</h3>
      <p id="cardDesc">Pasa el cursor o presiona cualquier cuadro arriba.</p>
    </div>
  </div>

  <script>
    const boxes = document.querySelectorAll('.local-box');
    const infoCard = document.getElementById('infoCard');
    const cardTitle = document.getElementById('cardTitle');
    const cardDesc = document.getElementById('cardDesc');

    function activateLocal(box) {
      boxes.forEach(b => b.classList.remove('active'));
      box.classList.add('active');
      cardTitle.textContent = box.getAttribute('data-title');
      cardDesc.textContent = box.getAttribute('data-desc');
      infoCard.classList.add('active');
    }

    boxes.forEach(box => {
      box.addEventListener('mouseenter', () => activateLocal(box));
      box.addEventListener('click', (e) => {
        e.stopPropagation();
        activateLocal(box);
      });
    });
  </script>

</body>
</html>
